# Example overrides. Every key and its default lives in src/main/resources/application.yml.
# Use as: java -jar target/distributed-task-platform-0.1.0-SNAPSHOT.jar --spring.config.additional-location=file:configs/example.properties
# or set the same keys as environment variables (TASKPLATFORM_LEASE_DURATION=10s, ...).

server.port=18080
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/taskplatform
spring.datasource.username=taskplatform
# spring.datasource.password=  (pass it through the environment, never commit it)

# Leases: a crashed worker's job is retried after about lease-duration + reconciler.lease-grace.
taskplatform.lease-duration=30s
taskplatform.heartbeat-interval=10s

# Retries: capped exponential backoff with bounded jitter.
taskplatform.retry.initial-delay=1s
taskplatform.retry.multiplier=2.0
taskplatform.retry.max-delay=60s
taskplatform.retry.jitter=0.5
taskplatform.retry.default-max-attempts=3

# Reconciler.
taskplatform.reconciler.interval=1s
taskplatform.reconciler.lease-grace=2s
taskplatform.reconciler.pending-grace=5s
taskplatform.reconciler.redispatch-after=60s

# Worker pools: one per queue.
taskplatform.workers.pools[0].name=default
taskplatform.workers.pools[0].queue=default
taskplatform.workers.pools[0].concurrency=4
taskplatform.workers.pools[1].name=batch
taskplatform.workers.pools[1].queue=batch
taskplatform.workers.pools[1].concurrency=2
