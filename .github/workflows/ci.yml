name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit tests, then integration tests on embedded PostgreSQL. Tests that need Docker (RabbitMQ, Redis via
      # Testcontainers) run because the hosted runner has Docker; they skip themselves where Docker is missing.
      - name: Build and test
        run: sh ./mvnw -B verify

      - name: Validate the compose file
        run: docker compose config --quiet

      - name: Build the container image
        run: docker build --tag distributed-task-platform:ci .

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
